<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留序 · Client Studio</title><link rel="stylesheet" href="/style.css"><body>
<header><div class="brand">留序 <span>LIUXU</span></div><div>CLIENT STUDIO <small>客户关系工作台</small></div><span id="health">检查本地模型…</span></header>
<main><aside><div class="eyebrow">CLIENT BOOK / 虚构案例</div><h2>每次联系，<br>都有它的理由。</h2><div id="cases"></div><button id="new">＋ 新建输入</button><p class="muted">本地运行 · 无云端推理<br>所有人物、商品及活动均为虚构</p></aside>
<section class="workspace"><div class="title"><div><div class="eyebrow">COMPOSE WITH CONTEXT</div><h1>从理解开始沟通</h1></div><span class="badge">Qwen3 · 8B</span></div>
<details open><summary>客户与沟通背景 <span>编辑输入</span></summary><div class="form"><label>客户信息与标签<textarea id="client" rows="3"></textarea></label><label>明确需求与限制<textarea id="constraints" rows="3" placeholder="保留客户原话；未知不要补全"></textarea></label><label>沟通场景<select id="scenario"></select></label><label>沟通方向<select id="direction"><option>CA主动触达</option><option>回复客户</option><option>混合上下文</option></select></label><label>历史对话<textarea id="history" rows="3"></textarea></label><label>产品 / 活动事实<textarea id="product" rows="3"></textarea></label></div></details>
<div class="actions"><select id="mode" aria-label="生成方法"><option value="strategy">显式理解与策略</option><option value="direct">直接生成基线</option></select><button class="primary" id="generate">生成三条候选 ↗</button><button id="judge" disabled>Judge 评测</button><button id="edit" disabled>AI Edit · 一次</button></div><p id="status" role="status">选择左侧案例，或输入新的客户情境。</p>
<div id="brief"></div><div id="candidates" class="candidates"><div class="empty">三种表达，一个共同目标。<br><small>生成后，在这里比较并选择适合客户的消息。</small></div></div>
<section id="evaluation" hidden></section><details id="original" hidden><summary>查看修订前记录</summary><pre></pre></details>
<div class="footer"><button id="export" disabled>导出本次记录</button><span id="selection">尚未选择候选 · 仅预览，不发送微信</span></div><details><summary>本次会话的对比记录</summary><div id="archive"></div></details></section></main><script type="module" src="/app.js"></script></body></html>
